# Fleet manifest — the shared view of the repos this fleet coordinates.
#
# Checked in, and deliberately machine-independent: repos are identified by their
# GitHub `owner/name`, which is what the issue ledger keys on and is identical on
# every machine and for every person. NO local clone paths belong in this file —
# put those in fleet.local.yaml (gitignored) if you need them at all.
#
# Replace every <placeholder> below. Delete the examples.

mode: operator          # operator | auto-coordinate  (changing this is an operator decision)

repos:
  - repo: <owner>/<producer>        # e.g. acme/api-gateway
    produces: [<artifact>]          # stable names other repos consume (image, schema, library)

  - repo: <owner>/<consumer>
    consumes: [<artifact>]          # must match a name in some repo's `produces`

# Cross-repo handoffs are GitHub issues labelled `dependencies`, filed on the CONSUMING
# repo and linking the producing PR. Issues are the durable ledger: if every piece of
# automation stops, the ledger still records what is owed to whom.

topics:                 # cross-cutting views /chronicle maintains in index/topics/
  - <topic>             # e.g. authz — a concern that spans several repos
